<!DOCTYPE html>
<html lang="en">
<head>
    <title>Page not found</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        // Contrail share links (/contrail/d/<date>, /contrail/c/<n>?s=<k>) open
        // the game when it is installed; otherwise they land here and go on to
        // the Contrail page, carrying the link so it can offer "Open in app".
        (function () {
            var p = location.pathname;
            if (p.indexOf('/contrail/') === 0) {
                var rest = p.slice('/contrail/'.length).replace(/\/+$/, '');
                location.replace('/contrail/' + (rest ? '?to=' + encodeURIComponent(rest + location.search) : ''));
            }
        })();
    </script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1a1a2e; color: #fff; text-align: center; padding: 80px 20px; }
        a { color: #a29bfe; }
    </style>
</head>
<body>
    <h1>Page not found</h1>
    <p><a href="/">Back to home</a></p>
</body>
</html>
