<!DOCTYPE html>
<html lang="en">
<head>
    <title>Contrail: Airport Puzzle</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A calm airport puzzle: send every plane out on time and build your airfield.">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            max-width: 640px; margin: 0 auto; padding: 56px 20px; min-height: 100vh; box-sizing: border-box;
            background: linear-gradient(180deg, #1b2440 0%, #3b3a63 60%, #f2a65a 140%);
            color: #fff; text-align: center;
        }
        h1 { font-size: 2.2em; margin: 12px 0 6px; }
        .plane { font-size: 3em; }
        p { color: #d6d9e6; line-height: 1.6; }
        .card { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.15); border-radius: 16px; padding: 24px; margin: 28px 0; }
        .btn { display: inline-block; margin: 8px; padding: 12px 22px; border-radius: 10px; text-decoration: none; font-weight: 600; color: #1b2440; background: #f2a65a; }
        .btn.ghost { background: rgba(255,255,255,0.15); color: #fff; }
        .soon { font-size: 0.95em; color: #c8cbe0; }
        #open { display: none; }
        footer { margin-top: 48px; font-size: 0.9em; }
        footer a { color: #d6d9e6; }
    </style>
</head>
<body>
    <div class="plane">✈️</div>
    <h1>Contrail: Airport Puzzle</h1>
    <p>Send every plane out on time, clear the board and build your airfield one building at a time. A new Daily board every day.</p>

    <div class="card" id="open">
        <p id="open-text">A friend sent you a board.</p>
        <a class="btn" id="open-link" href="#">Open in Contrail</a>
    </div>

    <div class="card">
        <p class="soon">Coming soon to the App Store and Google Play.</p>
    </div>

    <footer>
        <a href="/contrail-privacy-policy/">Privacy Policy</a> · <a href="/">More games</a>
    </footer>

    <script>
        // ?to=d/2026-11-08 or ?to=c/27?s=6 (set by /404.html): offer the
        // app's own scheme, which the game parses like the web link.
        (function () {
            var to = new URLSearchParams(location.search).get('to');
            if (!to || !/^(d|c|daily|level)\/[0-9-]+(\?s=[0-9]+)?$/.test(to)) return;
            document.getElementById('open-link').href = 'contrail://' + to;
            document.getElementById('open-text').textContent =
                to.charAt(0) === 'd' ? 'A friend shared a Daily board.' : 'A friend challenged you to a level.';
            document.getElementById('open').style.display = 'block';
        })();
    </script>
</body>
</html>
